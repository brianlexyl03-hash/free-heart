[package]
name = "free-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.90.0"

[dependencies]
axum = "0.8.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "net", "signal"] }
moviebox-tui = { package = "moviebox-tui", path = "../third_party/moviebox-tui/src", default-features = false }

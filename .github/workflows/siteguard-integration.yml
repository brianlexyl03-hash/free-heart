name: Free Heart SiteGuard integration checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, integrate/siteguard-into-free-heart]
jobs:
  node-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check server/src/index.js
      - run: node --check web/siteguard/siteguard.js
      - run: node --check web/app.js
      - run: node --check web/sw.js

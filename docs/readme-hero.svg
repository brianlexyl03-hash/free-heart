<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">free-heart: turn a story into a short-form moment</title>
  <desc id="desc">An animated cinematic workflow from discovery to watching, clipping, captioning and publishing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset=".52" stop-color="#15112e"/><stop offset="1" stop-color="#071b25"/></linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7c5cff"/><stop offset=".48" stop-color="#ff5ea8"/><stop offset="1" stop-color="#20e3b2"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#ffe58a" stop-opacity=".9"/><stop offset="1" stop-color="#ffbf3c" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".42"/></filter>
    <style>
      .pulse { animation: pulse 2.6s ease-in-out infinite; transform-origin: 920px 160px; }
      .travel { stroke-dasharray: 14 18; animation: travel 2.2s linear infinite; }
      .spark { animation: spark 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity:.58; transform:scale(.82) } 50% { opacity:1; transform:scale(1.08) } }
      @keyframes travel { to { stroke-dashoffset:-64 } }
      @keyframes spark { 0%,58%,100% { opacity:.15 } 68%,86% { opacity:1 } }
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
    </style>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <circle cx="930" cy="160" r="120" fill="url(#glow)" filter="url(#blur)" class="pulse"/>
  <path d="M48 382 C190 382 166 112 322 112 S440 382 564 382 684 112 824 112 916 382 1148 382" fill="none" stroke="#ffffff" stroke-opacity=".06" stroke-width="34"/>
  <path d="M48 382 C190 382 166 112 322 112 S440 382 564 382 684 112 824 112 916 382 1148 382" fill="none" stroke="url(#wire)" stroke-width="5" class="travel"/>
  <g filter="url(#shadow)">
    <rect x="62" y="58" width="286" height="160" rx="20" fill="#111a36" stroke="#5260a8"/>
    <text x="88" y="98" fill="#9ca9ff" font-size="13" font-weight="700" letter-spacing="2">01 · DISCOVER</text>
    <text x="88" y="137" fill="#fff" font-size="27" font-weight="800">Find a story</text>
    <text x="88" y="170" fill="#aeb8d8" font-size="15">Search titles, seasons and</text><text x="88" y="192" fill="#aeb8d8" font-size="15">live matchday information.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="414" y="292" width="300" height="160" rx="20" fill="#201536" stroke="#a15b9e"/>
    <text x="440" y="332" fill="#ff9bd0" font-size="13" font-weight="700" letter-spacing="2">02 · CLIP STUDIO</text>
    <text x="440" y="371" fill="#fff" font-size="27" font-weight="800">Make the moment</text>
    <text x="440" y="404" fill="#d7b9d8" font-size="15">Trim, caption and shape</text><text x="440" y="426" fill="#d7b9d8" font-size="15">a short-form edit offline.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="784" y="58" width="330" height="160" rx="20" fill="#102b31" stroke="#3ba999"/>
    <text x="810" y="98" fill="#72f4d0" font-size="13" font-weight="700" letter-spacing="2">03 · CONNECT</text>
    <text x="810" y="137" fill="#fff" font-size="27" font-weight="800">Light up your reach</text>
    <text x="810" y="170" fill="#b2d9d1" font-size="15">AI captions, official APIs,</text><text x="810" y="192" fill="#b2d9d1" font-size="15">Postiz and Web Push alerts.</text>
  </g>
  <g transform="translate(918 246)" class="pulse">
    <path d="M0 0 C-42 0-72 32-72 72 0 76 0 120 0 120s0-44 72-48C72 32 42 0 0 0Z" fill="#fff5bd" stroke="#ffd65a" stroke-width="5"/>
    <path d="M-28 124h56M-22 138h44" stroke="#ffd65a" stroke-width="8" stroke-linecap="round"/>
    <path d="M0 -18v-28M-74 20l-24-16M74 20l24-16M-62 76l-30 6M62 76l30 6" stroke="#ffe48a" stroke-width="6" stroke-linecap="round" class="spark"/>
  </g>
  <text x="600" y="496" text-anchor="middle" fill="#7783ab" font-size="13" letter-spacing="3">WATCH · SAVE · CLIP · CAPTION · SHARE</text>
</svg>
